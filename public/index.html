<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo Seguro</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Catalogo Seguro</h1>
    <nav id="navAuth"></nav>
  </header>

  <main>
    <section class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar productos...">
      <button id="searchBtn">Buscar</button>
    </section>

    <section id="adminPanel" class="admin-panel hidden">
      <h2>Agregar producto (solo admin)</h2>
      <form id="productForm">
        <input type="text" id="p_name" placeholder="Nombre" required maxlength="120">
        <input type="text" id="p_description" placeholder="Descripcion" required maxlength="500">
        <input type="number" id="p_price" placeholder="Precio" required min="0" step="100">
        <input type="text" id="p_category" placeholder="Categoria" required maxlength="50">
        <input type="number" id="p_stock" placeholder="Stock" required min="0">
        <button type="submit">Agregar</button>
      </form>
      <p id="productMsg"></p>
    </section>

    <section id="productGrid" class="product-grid"></section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
